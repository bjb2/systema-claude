[package]
name = "systema-claude-app"
version = "0.1.0"
description = "systema-claude desktop shell — Tauri application that pairs with the orgd daemon to present a workspace UI."
authors = ["Bryan Bartley"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/bjb2/systema-claude"

[lib]
name = "org_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Required for production builds — embeds assets via tauri://localhost
# instead of pointing at the vite dev server. `tauri build` enables this
# automatically; bare `cargo build --release` must pass it explicitly.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
chrono = { version = "0.4", features = ["clock"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
once_cell = "1"
base64 = "0.22"
sha2 = "0.10"
serde_yaml = "0.9"
rand = "0.8"
urlencoding = "2"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
